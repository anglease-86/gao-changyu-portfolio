<!doctype html>
<html><head><meta charset="utf-8"><title>Project visual studies</title><style>html,body{margin:0;background:#0b0c0e;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style><script type="importmap">{"imports":{"three":"../assets/vendor/three.module.js"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);
window.renderStudy = index => {
  const scene = new THREE.Scene();scene.background = new THREE.Color(0x0b0c0e);
  const camera = new THREE.OrthographicCamera(-8.4,8.4,7,-7,.1,100);
  camera.position.set(11,9,13);camera.lookAt(0,.2,0);
  scene.add(new THREE.HemisphereLight(0xd5d8e0,0x11151a,.95));
  const key = new THREE.DirectionalLight(0xe6e8ec,3);key.position.set(-5,12,5);key.castShadow = true;
  key.shadow.mapSize.set(2048,2048);key.shadow.camera.left = -12;key.shadow.camera.right = 12;key.shadow.camera.top = 12;key.shadow.camera.bottom = -12;key.shadow.normalBias = .03;scene.add(key);
  const palette = [0x8096d2,0x62aaa8,0x9983c3,0x899f62,0xc17179,0xbe925c];
  const accent = palette[index];
  const white = new THREE.MeshStandardMaterial({color:0x858d98,roughness:.38,metalness:.34});
  const dark = new THREE.MeshStandardMaterial({color:0x171a1f,roughness:.78,metalness:.1});
  const tint = new THREE.MeshStandardMaterial({color:accent,roughness:.34,metalness:.28,emissive:accent,emissiveIntensity:.075});
  const light = new THREE.MeshStandardMaterial({color:accent,emissive:accent,emissiveIntensity:1.1,roughness:.28,metalness:.16});
  const edgeLight = new THREE.DirectionalLight(accent,1.3);edgeLight.position.set(7,4,-5);scene.add(edgeLight);
  function box(w,h,d,x,y,z,material=white){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh;}
  function person(x,z,scale=.82,turn=0,tone=0xaab1bb){
    const group=new THREE.Group();group.position.set(x,.045,z);group.rotation.y=turn;group.scale.setScalar(scale);
    const coat=new THREE.MeshStandardMaterial({color:tone,roughness:.66,metalness:.08});
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.075,.13,.48,7),coat);body.position.y=.34;body.castShadow=true;group.add(body);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),new THREE.MeshStandardMaterial({color:0x9a8778,roughness:.8}));head.position.y=.65;head.castShadow=true;group.add(head);
    const legMaterial=new THREE.MeshStandardMaterial({color:0x30343b,roughness:.75});
    for(const offset of[-.055,.055]){const leg=new THREE.Mesh(new THREE.CylinderGeometry(.035,.04,.27,6),legMaterial);leg.position.set(offset,.07,0);leg.castShadow=true;group.add(leg);}
    scene.add(group);
  }
  function lightBeam(x,z,opacity=.045){
    const beam=new THREE.Mesh(new THREE.ConeGeometry(1.55,4.1,24,1,true),new THREE.MeshBasicMaterial({color:accent,transparent:true,opacity,side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending}));
    beam.position.set(x,2.03,z);scene.add(beam);
  }
  function rail(points,color=accent){const geo=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));scene.add(new THREE.Line(geo,new THREE.LineBasicMaterial({color,transparent:true,opacity:.6})));}
  box(13,.16,10,0,-.2,0,dark);
  const grid=new THREE.GridHelper(18,36,0x343940,0x24282d);grid.position.y=-.105;scene.add(grid);
  if(index===0){
    for(let x=-4.5;x<=4.5;x+=3)for(let z=-2.5;z<=2.5;z+=2.5){
      box(2.3,.14,1.8,x,.03,z);box(.08,1.5,1.8,x-1.1,.85,z);box(2.3,1.5,.08,x,.85,z-.85);box(.85,.65,.5,x,.4,z+.5,tint);
      box(2.4,.055,.06,x,1.7,z-.85,light);
    }
    for(const [x,z] of[[-5,1.1],[-2.4,1.15],[.3,1.2],[3,1.15],[5.3,1.1]])person(x,z,.78,0,0x75839e);
    for(const x of[-6,6]){box(.12,3.2,.12,x,1.5,-4);box(.12,3.2,.12,x,1.5,4);}box(12,.12,.12,0,3.1,-4);box(12,.12,.12,0,3.1,4);
  }else if(index===1){
    box(9,.3,3,0,.12,-2.5);box(9,3.2,.15,0,1.9,-3.8,dark);box(7.2,2.35,.04,0,2,-3.7,tint);
    for(let row=0;row<5;row++)for(let col=0;col<12;col++){const x=(col-5.5)*.62,z=row*.85;box(.4,.35,.4,x,.1,z,white);box(.4,.4,.07,x,.46,z+.2,dark);}
    for(let row=0;row<3;row++)for(let col=0;col<7;col++)person((col-3)*1.12,.35+row*1.45,.68,0,0x667d9d);
    lightBeam(-3.1,-1.7,.035);lightBeam(3.1,-1.7,.035);
    for(const x of[-5,5]){box(.1,4.1,.1,x,1.9,-3.5);box(.1,4.1,.1,x,1.9,3.5);}for(const z of[-3.5,3.5])box(10,.12,.12,0,3.95,z,light);
  }else if(index===2){
    for(let i=0;i<5;i++){const x=(i-2)*2.2;box(.18,2.8,5.5,x,1.3,-.2,i%2?tint:white);box(.12,.08,5.3,x+.12,2.65,-.2,light);}
    box(10.5,3.3,.22,0,1.5,-3.8,dark);box(2.5,2.2,.18,-3,1,-3.6,tint);box(2.5,2.2,.18,3,1,-3.6,white);
    for(const x of[-3.2,0,3.2])box(1.1,.8,.7,x,.3,3,tint);
    for(const [x,z] of[[-4,2],[-1.6,2],[1,2],[3.8,2],[0,3.9]])person(x,z,.8,Math.PI/2,0x83769d);
  }else if(index===3){
    box(9,.25,2.5,0,.03,-3.4);box(7.5,2.8,.12,0,1.5,-4.3,tint);
    for(const x of[-3.4,0,3.4])for(const z of[-.6,2.5]){
      const table=new THREE.Mesh(new THREE.CylinderGeometry(.85,.85,.1,48),white);table.position.set(x,.75,z);scene.add(table);box(.13,.8,.13,x,.3,z,dark);
      for(let i=0;i<6;i++){const a=i/6*Math.PI*2;box(.4,.45,.4,x+Math.cos(a)*1.15,.1,z+Math.sin(a)*1.15,tint);}
      for(let i=0;i<3;i++){const a=(i/3*Math.PI*2)+.3;person(x+Math.cos(a)*1.35,z+Math.sin(a)*1.35,.68,a,0x718d86);}
    }
  }else if(index===4){
    box(10,.3,3,0,.08,-3);box(9,3.4,.15,0,1.9,-4,dark);
    for(let i=0;i<9;i++)box(.45,2.8,.12,(i-4)*.85,1.8,-3.85,i%2?white:tint);
    box(.7,1.15,.65,-2,.8,-2,tint);
    for(let row=0;row<5;row++)for(let col=0;col<10;col++){let x=(col-4.5)*.75;box(.46,.4,.46,x,.12,row*.9);box(.46,.45,.08,x,.52,row*.9+.2,tint);}
    rail([[-5,3.7,-3.8],[5,3.7,-3.8],[5,3.7,3.8],[-5,3.7,3.8],[-5,3.7,-3.8]]);
    for(let i=0;i<12;i++)person((i%6-2.5)*1.45,.8+Math.floor(i/6)*2.5,.72,0,0x98767a);
    lightBeam(-2.8,-2.9,.04);lightBeam(2.8,-2.9,.04);
  }else{
    for(let i=0;i<6;i++){const z=(i-2.5)*1.4,h=2.5+Math.sin(i*.7)*.9;for(const x of[-3,3])box(.14,h,.14,x,h/2,z,i%2?white:tint);box(6,.14,.14,0,h,z,light);}
    box(5,.18,7.8,0,.05,0,dark);for(let i=0;i<11;i++)box(4.5,.02,.04,0,.15,(i-5)*.65,tint);
    for(const x of[-5,5])for(const z of[-2,1,3])box(.85,1.2,.85,x,.5,z,white);
    for(const [x,z] of[[-3,-2],[-1,0],[1,2],[3,-1],[0,3]])person(x,z,.83,Math.PI/5,0xa28b69);
    lightBeam(-3,-2,.035);lightBeam(3,2,.035);
  }
  for(const x of[-6,6])for(const z of[-4.5,4.5]){rail([[x-.25,.02,z],[x+.25,.02,z]],0x707780);rail([[x,.02,z-.25],[x,.02,z+.25]],0x707780);}
  renderer.render(scene,camera);
  window.studyReady=index;
};
window.renderStudy(0);
</script></body></html>
